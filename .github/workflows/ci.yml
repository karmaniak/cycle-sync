name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch or PR cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: CycleCore tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: swift:6.0-noble
    steps:
      - uses: actions/checkout@v4
      - run: swift test

  app:
    name: Build iOS app
    # macOS minutes are the expensive ones: build the app on pull requests
    # (and on demand), not again on the merge into main.
    if: github.event_name != 'push'
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
        working-directory: App
      - name: Build for simulator
        working-directory: App
        run: |
          set -o pipefail
          xcodebuild build \
            -project CycleCompanion.xcodeproj \
            -scheme CycleCompanion \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            | grep -E "error|warning: unre|BUILD|\*\*" || true
          test "${PIPESTATUS[0]}" -eq 0
